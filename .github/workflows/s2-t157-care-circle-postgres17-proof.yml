name: S2-T157 Care Circle PostgreSQL 17 proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  postgres17-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      S2_T148_ENGINE: docker
      S2_T135_POSTGRES_IMAGE: public.ecr.aws/supabase/postgres@sha256:80d7b27c3e8d77cfa7226eee9508671796da214781ff15a35b3670d7ad5ee453
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject remote database context
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL PGHOST PGDATABASE PGUSER PGPASSWORD; do
            [[ -z "${!name:-}" ]] || { printf 'STOP_S2_T157_REMOTE_DATABASE_CONTEXT_PRESENT\n' >&2; exit 1; }
          done
      - name: Validate reviewed proof inputs
        run: node scripts/s2-care-circle-0037-ci-readiness.mjs --verify
      - name: Run disposable PostgreSQL 17 proof
        run: bash scripts/run-care-circle-0037-four-digit.sh
      - name: Confirm no source mutation
        run: git diff --exit-code
      - name: Build closed proof artifact
        run: node scripts/s2-care-circle-postgres17-ci-artifact.mjs --write "$RUNNER_TEMP/s2-t162-care-circle-postgres17-proof.json"
      - name: Attest closed proof artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ runner.temp }}/s2-t162-care-circle-postgres17-proof.json
      - name: Upload closed proof artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s2-t162-care-circle-postgres17-proof
          path: ${{ runner.temp }}/s2-t162-care-circle-postgres17-proof.json
          if-no-files-found: error
          retention-days: 7
